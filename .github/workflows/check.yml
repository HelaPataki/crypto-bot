name: check-results
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python check_results.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
          FORCE_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in signals.csv repeats.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "update results" && git pull --rebase && git push)
